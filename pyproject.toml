[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qcvol"
version = "0.1.0"
description = "Reproducible quantum stochastic volatility course experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "scipy>=1.16,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
plots = ["matplotlib>=3.10,<4"]
finance = ["arch>=7.2,<9"]
v2 = [
    "jax>=0.4.35,<0.5",
]

[project.scripts]
qcvol = "qcvol.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "qvol/tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["qvol"]

[tool.hatch.build.targets.wheel]
packages = ["src/qcvol", "src/qcvol_v2", "src/qcvol_v3", "src/qcvol_next"]
