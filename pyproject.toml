[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qcvol"
version = "0.1.0"
description = "Reproducible quantum stochastic volatility course experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "scipy>=1.16,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
plots = ["matplotlib>=3.10,<4"]
finance = ["arch>=7.2,<9"]

[project.scripts]
qcvol = "qcvol.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/qcvol"]
